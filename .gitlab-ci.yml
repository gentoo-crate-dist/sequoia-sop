stages:
  - pre-check
  - build
  - test

include:
  - component: "gitlab.com/sequoia-pgp/common-ci/sequoia-pipeline@main"

variables:
  SEQUOIA_CRYPTO_POLICY: ""

sop-tests:
  stage: test
  image: jampot.sequoia-pgp.org/sequoia-pgp/build-docker-image/trixie:latest
  script:
    - cargo build --features cli
    - mkdir spec
    - git init spec
    - cd spec
    - git remote add origin https://gitlab.com/dkg/openpgp-stateless-cli
    - git fetch --depth 1 origin d4870845e925b85bbb0250c9fcc8369f2b191078
    - git checkout FETCH_HEAD
    - bash test/evaluate $CI_PROJECT_DIR/target/debug/sqop
    - sh test/simple-sop-test $CI_PROJECT_DIR/target/debug/sqop
  variables:
    GIT_STRATEGY: clone
