[package]
name = "sequoia-sop"
description = "An implementation of the Stateless OpenPGP Interface using Sequoia"
version = "0.38.0-pqc.1"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
]
documentation = "https://docs.rs/sequoia-sop"
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia-sop"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "sop", "stateless-openpgp"]
categories = ["cryptography", "command-line-utilities"]
license = "GPL-2.0-or-later"
edition = "2021"
rust-version = "1.85"

[badges]
gitlab = { repository = "sequoia-pgp/sequoia-sop" }
maintenance = { status = "actively-developed" }

[dependencies]
sop = "0.8.1"
sequoia-openpgp = { version = "2.2.0-pqc.1", default-features = false }
sequoia-policy-config = { version = "0.9.0-pqc.1", default-features = false, optional = true }
sequoia-wot = { version = "0.16.0-pqc.1", default-features = false }
anyhow = "1.0.18"

[build-dependencies]
sop = "0.8.1"
sequoia-openpgp = { version = "2.2.0-pqc.1", default-features = false }

[lib]

[[bin]]
name = "sqop"
required-features = ["cli"]

[[bin]]
name = "sqopv"
required-features = ["cliv"]

[features]
default = ["crypto-nettle"]
cli = ["sop/cli", "dep:sequoia-policy-config"]
cliv = ["sop/cliv", "dep:sequoia-policy-config"]
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
crypto-botan = ["sequoia-openpgp/crypto-botan"]
crypto-botan2 = ["sequoia-openpgp/crypto-botan2"]
crypto-cng = ["sequoia-openpgp/crypto-cng"]
crypto-rust = ["sequoia-openpgp/crypto-rust"]

[patch.crates-io]
buffered-reader = { git = "https://gitlab.com/sequoia-pgp/sequoia", branch = "pqc" }
sequoia-openpgp = { git = "https://gitlab.com/sequoia-pgp/sequoia", branch = "malte/certbuilder_pk_algos" }
openssl = { git = "https://github.com/teythoon/rust-openssl", branch = "justus/pqc" }
openssl-sys = { git = "https://github.com/teythoon/rust-openssl", branch = "justus/pqc" }
sequoia-policy-config = { git = "https://gitlab.com/sequoia-pgp/sequoia-policy-config", branch = "pqc" }
